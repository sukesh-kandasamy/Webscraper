<!-- Dialog (M3 basic dialog): confirm / prompt -->
<template x-if="dialog">
  <div class="overlay" @click.self="closeDialog(false)">
    <div class="dialog animate-fade-up" role="dialog" aria-modal="true" :aria-label="dialog.title">
      <form @submit.prevent="closeDialog(true)">
        <div class="flex flex-col items-center text-center" :class="dialog.input && 'items-start text-left'">
          <span class="mb-4" :class="dialog.danger ? 'text-error' : 'text-secondary'" x-show="!dialog.input"
                x-html="icon(dialog.danger ? 'warning' : 'info', 'h-6 w-6')"></span>
          <h2 class="headline-s text-on-surface" x-text="dialog.title"></h2>
          <p class="body-m mt-4 text-on-surface-variant" x-show="dialog.message && !dialog.input" x-text="dialog.message"></p>
        </div>
        <template x-if="dialog.input">
          <div class="mt-4">
            <label class="label text-on-surface-variant" for="dialog-input" x-text="dialog.message"></label>
            <input id="dialog-input" type="text" x-model="dialog.value" class="input" maxlength="300">
          </div>
        </template>
        <div class="mt-6 flex justify-end gap-2">
          <button type="button" class="btn-ghost h-10 px-3 text-sm" @click="closeDialog(false)">Cancel</button>
          <button id="dialog-ok" type="submit" class="btn-ghost h-10 px-3 text-sm" :class="dialog.danger ? 'text-error' : ''" x-text="dialog.confirmText"></button>
        </div>
      </form>
    </div>
  </div>
</template>
