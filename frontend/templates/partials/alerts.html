<!-- Error banner -->
<div x-show="error" x-cloak x-transition.opacity role="alert"
     class="flex items-start gap-4 rounded-m3-md bg-error-container px-4 py-3 text-sm text-on-error-container">
  <span class="mt-0.5" x-html="icon('error', 'h-6 w-6')"></span>
  <div class="min-w-0 flex-1 py-0.5">
    <div class="title-s" x-text="error?.title"></div>
    <div class="mt-0.5 opacity-90" x-show="error?.hint" x-text="error?.hint"></div>
    <details class="mt-2" x-show="advanced && error?.raw"><summary class="text-xs opacity-80">Technical details</summary>
      <div class="mt-1 break-words font-mono text-xs opacity-80" x-text="error?.raw"></div></details>
  </div>
  <button class="btn btn-icon -my-1 -mr-2 text-on-error-container" @click="error=null" aria-label="Dismiss"><span x-html="icon('close', 'h-5 w-5')"></span></button>
</div>

<!-- Runs waiting for a person -->
<template x-for="j in needsYouJobs()" :key="'ny' + j.id">
  <div class="flex flex-wrap items-center gap-4 rounded-m3-md bg-warning-container px-4 py-3 text-sm text-on-warning-container">
    <span x-html="icon('warning', 'h-6 w-6')"></span>
    <div class="min-w-0 flex-1">
      <div class="title-s" x-text="`“${jobTitle(j)}” needs you`"></div>
      <div class="opacity-90" x-text="j.progress"></div>
    </div>
    <button class="btn btn-sm border-on-warning-container/40 text-on-warning-container" @click="stopJob(j)">Stop</button>
    <button class="btn btn-primary btn-sm" @click="startJobSolve(j)" :disabled="!status?.browser_available"
            x-text="j.paused_kind === 'login' ? 'Open to log in' : 'Open to solve'"></button>
  </div>
</template>
