<!-- Snackbars (M3): bottom of the screen, one line, dismissable -->
<div class="pointer-events-none fixed inset-x-0 bottom-6 z-[60] flex flex-col items-center gap-2 px-4" aria-live="polite">
  <template x-for="t in toasts" :key="t.id">
    <div class="snackbar w-full max-w-[560px] animate-fade-up">
      <span class="shrink-0" :class="t.type === 'error' ? 'text-error-container' : 'text-inverse-primary'"
            x-html="icon(t.type === 'error' ? 'error' : t.type === 'info' ? 'info' : 'check_circle', 'h-5 w-5')"></span>
      <span class="flex-1 py-1.5" x-text="t.msg"></span>
      <button class="btn btn-icon h-9 w-9 text-inverse-on-surface" @click="toasts = toasts.filter(x => x.id !== t.id)" aria-label="Dismiss">
        <span x-html="icon('close', 'h-5 w-5')"></span></button>
    </div>
  </template>
</div>
