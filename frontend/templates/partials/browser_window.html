<!-- Visible browser window for logging in / solving a human check yourself -->
<template x-if="win">
  <div class="overlay">
    <div class="dialog animate-fade-up" role="dialog" aria-modal="true">
      <div class="flex items-start gap-3">
        <span class="mt-1 text-secondary" x-html="icon(win?.mode === 'login' ? 'key' : 'shield', 'h-6 w-6')"></span>
        <div class="min-w-0 flex-1">
          <h2 class="headline-s text-on-surface" x-text="win?.mode === 'login' ? 'Log in to ' + win?.domain : 'Solve the check on ' + (win?.domain || '')"></h2>
          <p class="mt-1 truncate text-xs" x-text="win?.url"></p>
        </div>
        <span class="chip" :class="win?.status === 'open' ? 'chip-green' : (['error','timeout','cancelled'].includes(win?.status) ? 'chip-red' : 'chip-amber')" x-text="win?.status"></span>
      </div>
      <div class="body-m mt-4 space-y-3">
        <p x-show="win?.status === 'starting'" class="flex items-center gap-3"><span class="spinner text-primary"></span> Opening a browser window…</p>
        <template x-if="win?.status === 'open'">
          <div class="space-y-3">
            <p x-show="win?.mode === 'login'">A browser window is open. <b class="text-on-surface">Log in there yourself.</b> The app never sees your password; it only keeps the login, encrypted, for this site.</p>
            <p x-show="win?.mode !== 'login'">A browser window is open. <b class="text-on-surface">Solve the check yourself</b>, wait for the normal page, then come back here.</p>
            <div x-show="win?.mode === 'login' || win?.kind === 'login'">
              <label class="label">Account name <span class="hint">· optional label</span></label>
              <input type="text" x-model="win.account" class="input" maxlength="120">
            </div>
          </div>
        </template>
        <p class="text-error" x-show="['error','timeout'].includes(win?.status)" x-text="win?.message || 'The window closed.'"></p>
      </div>
      <div class="mt-6 flex justify-end gap-2">
        <button class="btn-ghost h-10 px-3 text-sm" @click="cancelWindow()">Cancel</button>
        <button class="btn btn-primary" @click="finishWindow()" :disabled="win?.status !== 'open' || busy === 'window'">
          <span x-show="busy === 'window'" class="spinner"></span>
          <span x-text="win?.mode === 'login' ? 'I’m logged in' : 'I’ve solved it'"></span>
        </button>
      </div>
    </div>
  </div>
</template>
